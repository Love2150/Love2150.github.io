
# ----------------------------------------
# Navigation
# ----------------------------------------
nav:
  - title: Home
    url: /
  - title: Projects
    url: /projects/
  - title: Blog
    url: /archive/
  - title: Reports
    url: /reports/analyst_report/
  - title: Contact
    url: /contact/

# ----------------------------------------
# Collections
# ----------------------------------------
collections:
  projects:
    output: true
    permalink: /projects/:name/
  reports:
    output: true
    permalink: /reports/:name/

# ----------------------------------------
# Defaults for content types
# ----------------------------------------
defaults:
  # Site-wide social preview fallback
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

  # Projects
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
      hidden: false
      weight: 100

  # Reports (e.g., analyst write-ups)
  - scope:
      path: ""
      type: "reports"
    values:
      layout: report
      hidden: false
      weight: 100

  # Markdown in reports/analyst_report/ folder
  - scope:
      path: "reports/analyst_report"
    values:
      layout: report
      hidden: false
      weight: 100

# ----------------------------------------
# Theme & Plugins
# ----------------------------------------
theme: minima
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

