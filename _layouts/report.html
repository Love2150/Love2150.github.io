---
layout: default
---
<article class="content-shell case-file report-file">
  <header class="page-heading">
    <p class="eyebrow">Analyst report · evidence brief</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
    {% if page.tags %}<p class="meta">Evidence labels: {{ page.tags | join: " · " }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
