{% assign social_image = page.og_image | default: page.image | default: site.image %}
{% assign canonical_url = page.url | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": {{ site.url | append: "/#person" | jsonify }},
      "name": {{ site.author.name | jsonify }},
      "url": {{ site.url | jsonify }},
      "image": {{ site.logo | absolute_url | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Killeen",
        "addressRegion": "TX",
        "addressCountry": "US"
      },
      "sameAs": {{ site.social.links | jsonify }}
    },
    {
      "@type": "WebSite",
      "@id": {{ site.url | append: "/#website" | jsonify }},
      "url": {{ site.url | jsonify }},
      "name": {{ site.title | jsonify }},
      "description": {{ site.description | jsonify }},
      "publisher": { "@id": {{ site.url | append: "/#person" | jsonify }} }
    },
    {% if page.url == "/" %}
    {
      "@type": "ProfilePage",
      "@id": {{ canonical_url | append: "#profile" | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | default: site.description | jsonify }},
      "image": {{ social_image | absolute_url | jsonify }},
      "mainEntity": { "@id": {{ site.url | append: "/#person" | jsonify }} },
      "isPartOf": { "@id": {{ site.url | append: "/#website" | jsonify }} }
    }
    {% elsif page.collection == "projects" %}
    {
      "@type": "CreativeWork",
      "@id": {{ canonical_url | append: "#project" | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.summary | default: page.description | default: site.description | jsonify }},
      "image": {{ social_image | absolute_url | jsonify }},
      "author": { "@id": {{ site.url | append: "/#person" | jsonify }} },
      "isPartOf": { "@id": {{ site.url | append: "/#website" | jsonify }} }
    }
    {% else %}
    {
      "@type": "WebPage",
      "@id": {{ canonical_url | append: "#page" | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ page.title | default: site.title | jsonify }},
      "description": {{ page.description | default: site.description | jsonify }},
      "image": {{ social_image | absolute_url | jsonify }},
      "isPartOf": { "@id": {{ site.url | append: "/#website" | jsonify }} }
    }
    {% endif %}
  ]
}
</script>
