---
layout: default
title: "Medium Archive"
description: "Brandon Love's external Medium article archive."
permalink: /medium.html
---
<section class="page-shell" id="medium" data-medium-resource="https://medium.com/@brandonlove2150">
  <header class="page-heading"><p class="eyebrow">External archive</p><h1>All Medium Posts</h1><p class="lede">Articles loaded from Medium. Filter the returned titles and descriptions.</p></header>
  <label for="filter">Filter posts</label><input id="filter" class="search" type="search" placeholder="Try DFIR, CVE, or Wireshark">
  <div id="medium-feed" class="project-grid" aria-live="polite"></div><p class="meta" id="count"></p>
</section>
<script defer src="https://medium-widget.pixelpoint.io/widget.js"></script>
<script>
(function () {
  const root = document.getElementById('medium'); const feed = document.getElementById('medium-feed'); const filter = document.getElementById('filter'); const count = document.getElementById('count');
  function init() { if (!window.MediumWidget) { window.setTimeout(init, 150); return; } MediumWidget.Init({renderTo:'#medium-feed',params:{resource:root.dataset.mediumResource,postsPerLine:3,limit:100,picture:'big',fields:['description','claps','publishAt'],ratio:'landscape'}}); window.setTimeout(function(){ const cards=Array.from(feed.children); cards.forEach(function(card){card.classList.add('project-card','project-card-body');}); count.textContent=cards.length ? cards.length+' post(s)' : 'No posts returned'; },500); }
  filter.addEventListener('input', function(){ const query=filter.value.trim().toLowerCase(); let shown=0; Array.from(feed.children).forEach(function(card){ const match=!query || card.textContent.toLowerCase().includes(query); card.hidden=!match; if(match) shown += 1; }); count.textContent=shown+' post(s)'; });
  window.addEventListener('load', init);
}());
</script>
