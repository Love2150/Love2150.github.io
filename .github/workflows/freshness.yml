name: Portfolio freshness

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install pinned freshness dependencies
        run: python -m pip install --require-hashes -r requirements-quality.txt

      - name: Check portfolio freshness
        id: freshness
        shell: bash
        run: |
          set +e
          python scripts/check_freshness.py --check-links --output freshness-report.md
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
          echo "findings=$status" >> "$GITHUB_OUTPUT"

      - name: Create or update the freshness issue
        if: steps.freshness.outputs.findings == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Portfolio freshness report"
          issue_number="$(gh issue list --state open --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file freshness-report.md
          else
            gh issue create --title "$title" --body-file freshness-report.md
          fi

      - name: Close resolved freshness issue
        if: steps.freshness.outputs.findings == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Portfolio freshness report"
          gh issue list --state open --search "${title} in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" |
            while read -r issue_number; do
              [ -z "$issue_number" ] || gh issue close "$issue_number" --comment "The scheduled freshness check now passes."
            done
