name: Portfolio quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true


      - name: Install pinned Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-medium.txt
          python -m pip install --require-hashes -r requirements-quality.txt

      - name: Run source and automation tests
        run: python -m unittest discover -s tests -v

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Validate generated HTML and internal references
        run: bundle exec htmlproofer ./_site --disable-external --no-enforce-https --ignore-urls "/^mailto:/"

      - name: Run Lighthouse accessibility smoke tests
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: lighthouserc.json
