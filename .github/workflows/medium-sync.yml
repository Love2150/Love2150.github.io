name: Medium-Jekyll sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'  # daily at 11:17 UTC

concurrency:
  group: medium-jekyll-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: automation/medium-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-medium.txt

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-medium.txt

      - name: Prepare reusable review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OPEN_PR="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -n "$OPEN_PR" ]; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main
          else
            git switch -C "$BRANCH" origin/main
          fi

      - name: Run importer
        run: |
          mkdir -p _posts
          python scripts/medium_to_jekyll.py \
            --feed "https://medium.com/feed/@brandonlove2150" \
            --out "_posts" \
            --author "Brandon Love"

      - name: Create or update review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add _posts
          if git diff --cached --quiet; then
            echo "No Medium changes to review."
            exit 0
          fi

          CHANGES="$(git diff --cached --name-status)"
          git commit -m "chore: sync Medium posts"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          {
            echo "## Automated Medium import"
            echo
            echo "This pull request contains new Medium articles for human review."
            echo
            echo '```text'
            printf '%s\n' "$CHANGES"
            echo '```'
            echo
            echo "### Required checks"
            echo "- [ ] Confirm the summary accurately describes the investigation"
            echo "- [ ] Confirm evidence images have meaningful alt text"
            echo "- [ ] Confirm the Medium canonical URL is preserved"
            echo "- [ ] Confirm the rendered article contains no private/local paths"
          } > "$RUNNER_TEMP/medium-pr-body.md"

          PR_NUMBER="$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: review imported Medium posts" \
              --body-file "$RUNNER_TEMP/medium-pr-body.md"
          else
            gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/medium-pr-body.md"
          fi
